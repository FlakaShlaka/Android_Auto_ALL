name: Build DriveHub APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project if uploaded as zip
        run: |
          Z=$(ls *.zip 2>/dev/null | head -n 1)
          if [ -n "$Z" ]; then echo "Unzipping $Z"; unzip -o -q "$Z"; fi

      - name: Find project folder
        run: |
          F=$(find . -name settings.gradle -not -path '*/node_modules/*' | head -n 1)
          if [ -z "$F" ]; then echo "settings.gradle not found"; ls -R | head -50; exit 1; fi
          DIR=$(dirname "$F")
          echo "Project folder: $DIR"
          echo "PROJ=$DIR" >> $GITHUB_ENV

      - name: Apply code fixes
        run: |
          cd "$PROJ"
          sed -i 's/CarContext\.ACTION_DIAL/Intent.ACTION_DIAL/g' app/src/main/java/com/ori/drivehub/car/TeamsScreen.kt
          grep -n "ACTION_DIAL" app/src/main/java/com/ori/drivehub/car/TeamsScreen.kt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: cd "$PROJ" && gradle assembleDebug --stacktrace --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: DriveHub-apk
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/*.apk
